<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registry V27.5 亚洲之门</title><style>body{background:#070b1e;color:#e6e8ff;font-family:system-ui;padding:24px}.gold{color:#D4AF37}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.vid{background:#0f1630;border:1px solid #1e2a5a;border-radius:16px;overflow:hidden}.vid iframe{width:100%;aspect-ratio:16/9;border:0}.meta{padding:12px;font-size:12px}.top{border:1px solid #1e2a5a;padding:16px;border-radius:12px;margin-bottom:20px;text-align:center}.btn{background:#D4AF37;color:#000;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:800;font-size:11px}</style></head><body><div class="top"><h1 class="gold">H.A.L.L.EL REGISTRY V27.5 亚洲之门</h1><p style="font-size:11px">AUTO-FETCH angels-hosts-api3 /v27.5/videos.json</p><p id="s">Loading...</p></div><div id="grid" class="grid"></div><script>const API="https://angels-hosts-api3.pharangels.workers.dev/v27.5/videos.json";async function load(){const d=await fetch(API).then(r=>r.json());document.getElementById('grid').innerHTML=d.videos.map(x=>`<div class=vid><iframe src="https://www.youtube.com/embed/${x.id}" allowfullscreen></iframe><div class=meta><b class=gold>${x.slot}</b> ${x.title}<br>${x.id}</div></div>`).join('');document.getElementById('s').innerText="LIVE "+d.count+" videos"}load()</script></body></html>
